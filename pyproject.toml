[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "business-idea-radar"
version = "0.1.0"
description = "Collect market signals from public data and rank them as business leads, with no API keys and no LLM"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alfredo Lorentiar Santonanda" }]
keywords = ["business-ideas", "market-research", "cli", "data", "hackernews"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5"]

[project.scripts]
business-idea-radar = "business_idea_radar.cli:main"

[project.urls]
Homepage = "https://github.com/alorentiar/business-idea-radar"
Issues = "https://github.com/alorentiar/business-idea-radar/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/business_idea_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
